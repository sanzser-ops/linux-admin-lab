---
- name: Demonstrate variables and templates
  hosts: linux_servers
  become: true

  vars:
    app_name: "linux-admin-lab"
    app_environment: "lab"

  tasks:

    - name: Generate application configuration
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: /etc/app.conf
        owner: root
        group: root
        mode: '0644'
